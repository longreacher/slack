name: Nightly Tide Scheduler Creator

on:
  schedule:
    # Runs once a day at 11:30 PM (23:30 UTC) to prepare tomorrow's triggers
    - cron: '58 23 * * *'
  workflow_dispatch: # Allows you to manually trigger it via GitHub to test

jobs:
  build_schedule:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.AUTOMATION_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Generate Tomorrow's Workflow
      run: python generate_workflow.py

    - name: Commit and Push Dynamically
      run: |
        # Configure Git bot identity for the commit history
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Stage the dynamically created file
        git add .github/workflows/tide_automation.yml
        
        # Only commit and push if the file actually changed
        if ! git diff --cached --quiet; then
          git commit -m "Automated Update: Scheduled tomorrow's precision slack triggers"
          
          # Force the push using your Personal Access Token injected into the remote URL
          git push https://x-access-token:${{ secrets.AUTOMATION_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
        else
          echo "No changes detected in the tide schedule for tomorrow. Skipping push."
        fi
